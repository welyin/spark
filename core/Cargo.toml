[package]
name = "spark-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
aes-gcm = "0.11.0"
base64 = "0.22.1"
log = "0.4"
bip39 = { version = "2.2", features = ["chinese-simplified"] }
cbc = { version = "0.2.1", features = ["alloc"] }
# orgAddress 的 RFC 4648 base32（小写无 padding）编解码（org.md §15）。
data-encoding = "2.9"
ed25519-dalek = "3.0.0"
fs4 = "0.12"
hex = "0.4.3"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.2"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order：pubsub 信封签名输入的键序 = 对象插入序（对齐 JS JSON.parse/stringify），
# 默认 BTreeMap 会破坏该口径，见 core/spec/p2p-messages.md §3.3。
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
# sled：纯 Rust 嵌入式 KV（维护模式，API 冻结可接受），kernel 门面的持久化后端。
sled = "0.34.7"
# libsqlite3-sys（bundled = vendored SQLite C 源码经 cc 编译）：移动端存储
# 后端（sqlite-backend §2.4）——无系统库依赖、版本确定，Android 交叉编译只需
# NDK 工具链（prebuilt 绑定，不需要 libclang——对照 rquickjs 的 bindgen 坑）。
# 设计原定 rusqlite 包装层；实施环境离线拉取不到 rusqlite 本体（其依赖
# hashlink/smallvec/memchr 已缓存而本体与 fallible-* 缺失），降级为直用其
# bundled 底层 libsqlite3-sys + 本库自持的薄同步封装（storage/sqlite.rs）。
# 依赖非可选（不 feature gate）：桌面 CI 同轨编译，避免移动端路径回归盲区。
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
thiserror = "2.0.19"
# M3 身份级 epoch / 跨组织邮箱：Ed25519→X25519 转换（CompressedEdwardsY::
# decompress + to_montgomery）与 X25519 共享密钥（MontgomeryPoint::mul_clamped，
# 内部 clamp）。纯 Rust，已在 lockfile 中经 libp2p 传递引入；对称加密部分
# 复用 aes-gcm。（原 O4 orgkey-deliver 注释随 C7 encrypted 轴退役改写。）
curve25519-dalek = "4.1"

# p2p 模块网络栈（core/spec/p2p-messages.md §1）：
# rust-libp2p 已弃 mplex，多路复用器用 yamux（TS 侧后续加 yamux 互通）。
libp2p = { version = "0.56.0", features = [
  "tcp",
  "dns",
  "websocket",
  "noise",
  "yamux",
  "gossipsub",
  "kad",
  "mdns",
  "identify",
  "ping",
  "relay",
  # dcutr：电路升直连打洞（dcutr-hole-punch 设计 §2.1；纯 Rust 无平台依赖，移动端同编译）
  "dcutr",
  "autonat",
  "upnp",
  "request-response",
  "macros",
  "tokio",
] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
# request_response::Codec 以 async_trait 声明，实现侧需要同名宏。
async-trait = "0.1.89"
# 本机网卡枚举：通配 listen 地址（0.0.0.0/::）展开为可拨号的具体地址。
if-addrs = "0.15"
# 插件后台运行时的 JS 引擎（plugin-runtime 设计）：QuickJS 纯 C 嵌入，
# 二进制增量约 1~2MB；引擎级内存上限/中断 handler 支撑插件熔断。
#
# bindgen：QuickJS 对 Android 等目标不提供预生成绑定。启用 bindgen 后
# rquickjs-sys 的 build.rs 在「宿主 target == 构建 target」时会复用捆绑绑定
# （x86_64-pc-windows-msvc 等均自带），无需 libclang；仅在交叉编译（Android
# target != host）时才真正跑 bindgen，需设置 LIBCLANG_PATH 指向 libclang.dll。
rquickjs = { version = "0.12.2", features = ["loader", "bindgen"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# sys.exec 超时进程树强杀：负 pid 向子进程组发 SIGKILL（见 sys.rs kill_process_tree）。
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["full"] }
