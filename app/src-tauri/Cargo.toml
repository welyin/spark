[package]
name = "spark-app"
version = "0.1.0"
description = "Spark app shell (Tauri 2.x, PC + mobile)"
edition = "2021"

[lib]
# 移动端复用同一 lib 入口（staticlib/cdylib），桌面仅使用 rlib。
name = "spark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Rust 内核：身份/文档/组织/数据治理/P2P 的门面单例（同步 API）。
spark-core = { path = "../../core" }
tauri = { version = "2", features = [] }
# 保存/打开对话框（data-export 导出路径选择，前端适配层经 @tauri-apps/plugin-dialog 调用）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# broadcast::Receiver<P2pEvent> 的类型命名（事件转发任务）。
tokio = { version = "1", features = ["sync", "time"] }
# 插件市场：包 sha256 校验 / PEM 与签名 base64 / hex 摘要。
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
# 插件市场：https 清单/包下载（本地 dist-market 与 file:// 优先）。
# TLS 用 rustls + 系统根证书：native-tls 在 Android 交叉编译需要平台 OpenSSL
# 开发包（openssl-sys 构建失败），rustls 为纯 Rust 实现跨平台零系统依赖。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# 桌面平台专属依赖：tauri-plugin-updater 仅支持桌面（Android/iOS 无此插件，
# 移动端更新走应用商店或自建 APK 渠道）。注意必须用内建 target_os 谓词——
# tauri 的 cfg(desktop) 自定义标志只对 rustc 可见，Cargo 依赖解析器不识别。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# 更新清单发布日期（tauri-plugin-updater 的 OffsetDateTime）RFC3339 格式化。
time = { version = "0.3", features = ["formatting"] }

# Android：moveTaskToBack 退后台保活（P2P 不断线）所需的 JNI 通道
# （MainActivity.onCreate 经 nativeSetActivity 注册实例，见 android_activity.rs）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# 市场服务测试：构造签名密钥对（内核同款 crate，仅测试用）。
ed25519-dalek = "3.0.0"
