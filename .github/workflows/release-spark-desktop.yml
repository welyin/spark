name: Release Spark Desktop

# 主程序发布流水线：tag（desktop-v*）触发 → tauri-action 按 matrix 构建
# macOS + Windows 包 → 用 minisign 私钥签名 updater 资产并生成 latest.json →
# 上传 GitHub Release → mirror 任务把 updater 资产镜像到滚动 release
# 「desktop-latest」（客户端 tauri-plugin-updater 的更新源即
# https://github.com/welyin/spark/releases/download/desktop-latest/latest.json，
# 滚动 release 避免 /releases/latest 别名被插件流水线的 release 抢占）。
#
# tag 前缀用 desktop-v* 而非 v*：v* 已被插件发布流水线
# （release-plugin-spark-example.yml）占用，两套流水线必须互不触发。
#
# 发版方式（二选一）：
# - Actions 页面运行「Bump Desktop Version」输入版本号：自动改版本文件 +
#   提交打 tag + 触发本流水线（日常推荐）；
# - 手动 git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#   （tag 版本号会与 tauri.conf.json 比对，不一致直接失败，防 tag/版本脱钩）。
#
# 需要的仓库 Secrets（一次性配置，缺一不可，否则产出的更新包验签失败）：
# - TAURI_SIGNING_PRIVATE_KEY：minisign 私钥全文
#   （本机 .secrets/spark-updater-signing.key 的内容；对应公钥已内置于
#   tauri.conf.json plugins.updater.pubkey）
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD：私钥密码
#   （本机 .secrets/spark-updater-signing.password 的内容）
#
# 手动发布兜底（CI 不可用时）：本机执行
#   cd app && npm run tauri build -- --bundles app,msi
#   然后用 `npx tauri signer sign` 对 bundle/macos/*.app.tar.gz 与
#   bundle/msi/*.msi.zip 签名生成 .sig，参照
#   https://v2.tauri.app/plugin/updater/ 手拼 latest.json（version /
#   pub_date / platforms.{darwin-aarch64,windows-x86_64}.{url,signature}）
#   并连同包一起上传到对应 Release。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: desktop-v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-desktop-release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag version matches tauri.conf.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          # 注意 macOS runner 是 BSD sed（不支持 \s），用 grep+cut 提取保持可移植
          CONF_VERSION=$(grep -m1 '"version"' app/src-tauri/tauri.conf.json | cut -d'"' -f4)
          if [[ "$CONF_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 tauri.conf.json 版本 ($CONF_VERSION) 不一致——先 bump 版本再发 tag"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Build and sign release (tauri-action 自动出 updater 资产与 latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: 'Spark Desktop v__VERSION__'
          releaseDraft: true
          prerelease: false

  # 镜像 updater 资产到滚动 release「desktop-latest」：
  # /releases/latest 别名会被任何新发布的 release（插件流水线也在发）抢走，
  # 所以客户端更新端点固定指向 desktop-latest；镜像时把 latest.json 里的
  # 下载 URL 一并改写到 desktop-latest，客户端不依赖版本号 release 是否公开。
  # 两个平台的构建都完成后执行一次（tauri-action 已把各平台资产归并到同一 Release，
  # updater 资产按平台区分命名：macOS *.app.tar.gz、Windows *.msi.zip / *.nsis.zip）。
  mirror-desktop-latest:
    needs: build-desktop-release
    runs-on: ubuntu-latest
    steps:
      - name: Mirror updater artifacts to rolling desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror
          echo "== assets on $RELEASE_TAG =="
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
          # 逐个模式下载；.sig 可能只内嵌 latest.json 不单独上传，容忍缺项
          gh release download "$RELEASE_TAG" --dir mirror --clobber -p 'latest.json'
          gh release download "$RELEASE_TAG" --dir mirror --clobber -p '*.app.tar.gz*' \
            || echo "::warning::未找到 macOS updater 资产（.app.tar.gz*）"
          gh release download "$RELEASE_TAG" --dir mirror --clobber -p '*.msi.zip*' \
            || echo "::warning::未找到 Windows updater 资产（.msi.zip*）"
          gh release download "$RELEASE_TAG" --dir mirror --clobber -p '*.nsis.zip*' \
            || echo "无 .nsis.zip 资产（未启用 nsis 时可忽略）"
          ls -la mirror
          test -f mirror/latest.json
          # latest.json 的平台下载 URL 改写到 desktop-latest
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("mirror/latest.json", "utf8"));
            for (const p of Object.values(j.platforms)) {
              p.url = p.url.replace(/\/download\/[^/]+\//, "/download/desktop-latest/");
            }
            fs.writeFileSync("mirror/latest.json", JSON.stringify(j, null, 2));
          '
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create desktop-latest --title "Spark Desktop 最新版（滚动更新源）" \
              --notes "由发布流水线自动维护，客户端更新端点固定指向此 release 的 latest.json。"
          gh release upload desktop-latest mirror/* --clobber
