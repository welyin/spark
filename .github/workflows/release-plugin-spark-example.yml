name: Release Plugin Spark Example

# 插件发布流水线（路径适配 code/ monorepo 布局：打包脚本在 plugins/scripts/，
# 产物落在 app/dist-market/plugins/<pluginId>/ 后重命名上传 Release）。
#
# 触发方式：
# - 推送版本 tag（git tag v0.2.0 && git push origin v0.2.0）：自动创建 Release、
#   打包、签名、上传资产，全程无需网页操作（tag 版本号会与 manifest.json 比对，
#   不一致直接失败，防 tag/版本脱钩）；
# - 或 workflow_dispatch 手动指定 tag / version / pluginId（tag 需已存在 Release）。
# 签名私钥取自仓库 secret SPARK_PLUGIN_SIGNING_PRIVATE_KEY（PEM 全文）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.2.0)"
        required: true
        type: string
      version:
        description: "Plugin version in manifest (optional, default from tag)"
        required: false
        type: string
      pluginId:
        description: "Plugin ID"
        required: false
        default: spark-example
        type: string

permissions:
  contents: write

jobs:
  build-plugin-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release variables
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            PLUGIN_ID="spark-example"
          else
            TAG="${{ inputs.tag }}"
            VERSION="${{ inputs.version }}"
            if [[ -z "$VERSION" ]]; then VERSION="${TAG#v}"; fi
            PLUGIN_ID="${{ inputs.pluginId }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify tag version matches plugin manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./plugins/${{ steps.vars.outputs.plugin_id }}/manifest.json').version")
          if [[ "$MANIFEST_VERSION" != "${{ steps.vars.outputs.version }}" ]]; then
            echo "::error::tag 版本 (${{ steps.vars.outputs.version }}) 与 manifest.json 版本 ($MANIFEST_VERSION) 不一致——先 bump 版本再发 tag"
            exit 1
          fi

      - name: Verify release exists for manual runs
        id: release_check
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          NORMALIZED="${TAG#v}"

          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" --silent || \
             gh api "repos/${{ github.repository }}/releases/tags/$NORMALIZED" --silent || \
             gh api "repos/${{ github.repository }}/releases/tags/v$NORMALIZED" --silent; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release tag '${{ steps.vars.outputs.tag }}' was not found. Skipping plugin manifest generation for this manual run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install app dependencies (plugin build reuses the app toolchain)
        run: npm ci --prefix app

      - name: Build plugin dist (vite ESM bundle + manifest)
        run: npm run build:example --prefix plugins

      - name: Build and sign plugin release artifacts
        if: github.event_name != 'workflow_dispatch' || steps.release_check.outputs.skip == 'false'
        env:
          SPARK_PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.SPARK_PLUGIN_SIGNING_PRIVATE_KEY }}
        run: |
          node plugins/scripts/build-example-package.mjs \
            --pluginId "${{ steps.vars.outputs.plugin_id }}" \
            --pluginDomain "plugin:${{ steps.vars.outputs.plugin_id }}" \
            --version "${{ steps.vars.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --releaseTag "${{ steps.vars.outputs.tag }}" \
            --outputDir "app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}"

      - name: Prepare named release assets
        if: github.event_name != 'workflow_dispatch' || steps.release_check.outputs.skip == 'false'
        shell: bash
        run: |
          PLUGIN_ID="${{ steps.vars.outputs.plugin_id }}"
          VERSION="${{ steps.vars.outputs.version }}"
          SRC_DIR="app/dist-market/plugins/$PLUGIN_ID"

          cp "$SRC_DIR/update-manifest.json" "$SRC_DIR/spark-plugin-$PLUGIN_ID-manifest.json"
          cp "$SRC_DIR/update-manifest.sig" "$SRC_DIR/spark-plugin-$PLUGIN_ID-manifest.sig"
          cp "$SRC_DIR/update-manifest.pub.pem" "$SRC_DIR/spark-plugin-$PLUGIN_ID-manifest.pub.pem"
          cp "$SRC_DIR/plugin-checksums.txt" "$SRC_DIR/spark-plugin-$PLUGIN_ID-checksums.txt"

          test -f "$SRC_DIR/spark-plugin-$PLUGIN_ID-$VERSION.spkg"

      - name: Upload plugin artifacts to release
        if: github.event_name != 'workflow_dispatch' || steps.release_check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 示例插件 ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}/spark-plugin-${{ steps.vars.outputs.plugin_id }}-${{ steps.vars.outputs.version }}.spkg
            app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}/spark-plugin-${{ steps.vars.outputs.plugin_id }}-manifest.json
            app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}/spark-plugin-${{ steps.vars.outputs.plugin_id }}-manifest.sig
            app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}/spark-plugin-${{ steps.vars.outputs.plugin_id }}-manifest.pub.pem
            app/dist-market/plugins/${{ steps.vars.outputs.plugin_id }}/spark-plugin-${{ steps.vars.outputs.plugin_id }}-checksums.txt
